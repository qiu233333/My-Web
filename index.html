<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>二次元个人主页</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(rgba(10,10,30,0.75),rgba(10,10,30,0.75)), url("https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=1600&auto=format&fit=crop");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            overflow-x: hidden;
        }

        /* 顶部导航 */

        nav {
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ffb6ff;
            text-shadow: 0 0 10px #ff8ef2;
        }

        .menu {
            display: flex;
            gap: 30px;
        }

            .menu a {
                color: white;
                text-decoration: none;
                transition: 0.3s;
            }

                .menu a:hover {
                    color: #ff9df5;
                }

        /* 主界面 */

        .hero {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px;
        }

        .card {
            width: 900px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 50px;
            display: flex;
            gap: 40px;
            box-shadow: 0 0 30px rgba(255,105,180,0.2);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .avatar {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            .avatar img {
                width: 280px;
                height: 280px;
                object-fit: cover;
                border-radius: 50%;
                border: 5px solid rgba(255,255,255,0.3);
                box-shadow: 0 0 25px #ff9ff3;
            }

        .content {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tag {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(45deg,#ff7eb3,#a18cd1);
            border-radius: 30px;
            margin-bottom: 20px;
            width: max-content;
            font-size: 14px;
        }

        h1 {
  font-size: 52px;
  margin-bottom: 15px;
  background: linear-gradient(to right, #ffd6ff, #c8b6ff);

  background-clip: text;
  -webkit-background-clip: text;

  color: transparent;
  -webkit-text-fill-color: transparent;
}

        .subtitle {
            color: #d6d6ff;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .desc {
            line-height: 1.9;
            color: #eee;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn-primary {
            background: linear-gradient(45deg,#ff7eb3,#ff758c);
            color: white;
            box-shadow: 0 0 20px rgba(255,118,136,0.4);
        }

            .btn-primary:hover {
                transform: translateY(-3px) scale(1.03);
            }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

            .btn-secondary:hover {
                background: rgba(255,255,255,0.2);
            }

        /* 技能 */

        .skills {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .skill {
            padding: 10px 18px;
            background: rgba(255,255,255,0.08);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }

            .skill:hover {
                background: #ff9df5;
                transform: scale(1.05);
            }

        /* 页脚 */

        footer {
            text-align: center;
            padding: 30px;
            color: #ccc;
            background: rgba(0,0,0,0.3);
        }

        /* 手机适配 */

        @media(max-width:900px) {

            nav {
                padding: 20px;
            }

            .card {
                flex-direction: column;
                width: 100%;
                padding: 35px;
            }

            h1 {
                font-size: 40px;
            }

            .avatar img {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <!-- 导航栏 -->
    <nav>
        <div class="logo">✦ Ayanami ✦</div>

        <div class="menu">
            <a href="#">首页</a>
            <a href="#">关于</a>
            <a href="#">项目</a>
            <a href="#">联系</a>
        </div>
    </nav>

    <!-- 主界面 -->
    <section class="hero">

        <div class="card">

            <!-- 头像 -->
            <div class="avatar">
                <img src="https://i.imgur.com/2DhmtJ4.jpeg" alt="头像">
            </div>

            <!-- 内容 -->
            <div class="content">

                <div class="tag">
                    二次元 / 开发者 / 学生
                </div>

                <h1>
                    你好，我是 Ayanami
                </h1>

                <div class="subtitle">
                    热爱编程与ACG文化 ✨
                </div>

                <div class="desc">
                    我是一名正在学习计算机技术的大学生，
                    喜欢数据结构、前端开发以及二次元文化。
                    目前正在制作属于自己的个人项目与网站。
                </div>

                <!-- 按钮 -->
                <div class="buttons">

                    <button class="btn btn-primary" onclick="showMessage()">
                        联系我
                    </button>

                    <button class="btn btn-secondary">
                        查看项目
                    </button>

                </div>

                <!-- 技能 -->
                <div class="skills">
                    <div class="skill">HTML</div>
                    <div class="skill">CSS</div>
                    <div class="skill">JavaScript</div>
                    <div class="skill">C语言</div>
                    <div class="skill">数据结构</div>
                    <div class="skill">React</div>
                </div>

            </div>

        </div>

    </section>

    <footer>
        © 2026 Ayanami | 二次元个人网站
    </footer>

    <script>

        function showMessage(){
        alert("邮箱：your_email@qq.com");
        }

    </script>

</body>
</html>
