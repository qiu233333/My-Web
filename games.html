<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桜小路秋玌的游戏生涯</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            cursor: url("./鼠标指针/arrow.cur"), url("./鼠标指针/arrow.ani"), auto;
        }

        body {
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: white;
            background: #160b24;
            overflow-x: hidden;
            cursor: url("./鼠标指针/arrow.cur"), url("./鼠标指针/arrow.ani"), auto;
        }

        a,
        button {
            cursor: url("./鼠标指针/link.cur"), url("./鼠标指针/link.ani"), pointer;
        }

        .background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .background-mask {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 72% 0%, rgba(255, 145, 220, 0.18), transparent 36%),
                linear-gradient(90deg, rgba(30, 11, 42, 0.94), rgba(30, 11, 42, 0.78));
            pointer-events: none;
        }

        .page-shell {
            width: min(1180px, calc(100% - 42px));
            margin: 0 auto;
            padding: 38px 0 70px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 34px;
        }

        .brand h1 {
            font-size: clamp(34px, 5vw, 58px);
            line-height: 1.1;
            text-shadow: 0 0 24px rgba(255, 153, 230, 0.36);
        }

        .brand p {
            margin-top: 10px;
            color: #ead9ff;
            line-height: 1.7;
        }

        .back-link {
            flex: 0 0 auto;
            padding: 12px 20px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 22px rgba(255,126,179,0.24);
            transition: 0.3s;
        }

        .back-link:hover {
            background: linear-gradient(45deg, #ff7eb3, #a18cd1);
            transform: translateY(-2px);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .summary-card {
            padding: 18px 20px;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 18px;
            background: rgba(255,255,255,0.09);
            backdrop-filter: blur(14px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.22);
        }

        .summary-card span {
            color: #d8c8ff;
            font-size: 14px;
        }

        .summary-card strong {
            display: block;
            margin-top: 8px;
            font-size: 28px;
            color: #fff;
        }

        .game-list {
            display: grid;
            gap: 18px;
        }

        .game-item {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 28px;
            align-items: center;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 22px;
            background: rgba(20, 10, 32, 0.62);
            backdrop-filter: blur(16px);
            box-shadow: 0 14px 36px rgba(0,0,0,0.24);
        }

        .game-cover {
            position: relative;
            height: 150px;
            overflow: hidden;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,126,179,0.35), rgba(80,178,255,0.28));
        }

        .game-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .game-cover::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.28));
        }

        .game-info {
            min-width: 0;
        }

        .game-upper {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(260px, 0.72fr);
            gap: 24px;
            align-items: start;
        }

        .game-info h2 {
            margin-bottom: 14px;
            font-size: clamp(26px, 4vw, 40px);
            font-weight: 700;
        }

        .game-hours {
            display: block;
            margin-bottom: 12px;
            color: #f2eaff;
            font-size: 30px;
        }

        .progress-track {
            width: min(520px, 100%);
            height: 12px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
        }

        .progress-fill {
            width: var(--progress);
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--bar-start), var(--bar-end));
            box-shadow: 0 0 14px rgba(255, 126, 179, 0.32);
        }

        .screenshot-gallery {
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
        }

        .screenshot-title {
            display: block;
            margin-bottom: 10px;
            color: #ffd6ff;
            font-weight: 700;
        }

        .screenshot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
        }

        .screenshot-button {
            width: 100%;
            height: 82px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(255,126,179,0.24), rgba(80,178,255,0.18));
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
            transition: 0.3s;
        }

        .screenshot-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 26px rgba(255,126,179,0.24);
        }

        .screenshot-button img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .game-review {
            margin-top: 14px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            color: #dccfff;
            line-height: 1.7;
        }

        .game-review strong {
            display: block;
            margin-bottom: 6px;
            color: #ffd6ff;
        }

        .rating-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 7px 12px;
            border-radius: 999px;
            color: #fff3bf;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .image-lightbox {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: rgba(4, 4, 18, 0.82);
            backdrop-filter: blur(12px);
        }

        .image-lightbox.is-open {
            display: flex;
        }

        .lightbox-panel {
            width: min(1100px, 100%);
            position: relative;
        }

        .lightbox-panel img {
            width: 100%;
            max-height: 78vh;
            object-fit: contain;
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 24px 70px rgba(0,0,0,0.45);
        }

        .lightbox-caption {
            margin-top: 12px;
            color: #ead9ff;
            text-align: center;
        }

        .lightbox-close {
            position: absolute;
            top: -18px;
            right: -18px;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 50%;
            color: white;
            background: rgba(24, 20, 48, 0.92);
            font-size: 26px;
            line-height: 1;
        }

        @media(max-width: 980px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .game-upper {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width: 720px) {
            .page-shell {
                width: min(100% - 28px, 1180px);
                padding-top: 24px;
            }

            .game-item {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .game-cover {
                height: auto;
                aspect-ratio: 16 / 7.5;
            }

            .game-hours {
                font-size: 24px;
            }

            .screenshot-button {
                height: 72px;
            }

            .lightbox-close {
                top: -14px;
                right: -10px;
            }
        }
    </style>
</head>

        const gameList = document.getElementById("gameList");
        const totalGames = document.getElementById("totalGames");
        const totalHours = document.getElementById("totalHours");
        const topGame = document.getElementById("topGame");
        const imageLightbox = document.getElementById("imageLightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const lightboxCaption = document.getElementById("lightboxCaption");
        const lightboxClose = document.getElementById("lightboxClose");

        function renderStars(score) {
            return "★".repeat(score) + "☆".repeat(5 - score);
        }

        function makePlaceholderCover(title) {
            const safeTitle = title
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
                    <defs>
                        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff7eb3"/>
                            <stop offset="52%" stop-color="#7f7fd5"/>
                            <stop offset="100%" stop-color="#2ed8ff"/>
                        </linearGradient>
                    </defs>
                    <rect width="640" height="300" fill="url(#bg)"/>
                    <rect width="640" height="300" fill="rgba(10,10,30,0.34)"/>
                    <text x="36" y="164" fill="white" font-size="42" font-family="Microsoft YaHei, sans-serif" font-weight="700">${safeTitle}</text>
                    <text x="36" y="218" fill="#ffe9ff" font-size="22" font-family="Microsoft YaHei, sans-serif">游戏生涯记录</text>
                </svg>
            `;

            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        function getScreenshots(game) {
            return game.screenshots?.length ? game.screenshots : [game.image];
        }

        function renderScreenshots(game) {
            return getScreenshots(game).map((src, index) => `
                <button class="screenshot-button" type="button" data-image="${src}" data-caption="${game.title} 截图 ${index + 1}">
                    <img src="${src}" alt="${game.title} 截图 ${index + 1}" loading="lazy" onerror="this.style.display='none'">
                </button>
            `).join("");
        }

        function openLightbox(src, caption) {
            lightboxImage.src = src;
            lightboxCaption.textContent = caption;
            imageLightbox.classList.add("is-open");
            imageLightbox.setAttribute("aria-hidden", "false");
        }

        function closeLightbox() {
            imageLightbox.classList.remove("is-open");
            imageLightbox.setAttribute("aria-hidden", "true");
            lightboxImage.src = "";
        }

        function renderGames() {
            const fullProgressHours = 200;
            const mostPlayedGame = games.reduce((top, game) => game.hours > top.hours ? game : top, games[0]);
            const total = games.reduce((sum, game) => sum + game.hours, 0);

            totalGames.textContent = games.length;
            totalHours.textContent = `${total.toFixed(1)}h`;
            topGame.textContent = mostPlayedGame.title;

            gameList.innerHTML = "";

            games.forEach((game) => {
                const progress = Math.min(100, Math.max(8, (game.hours / fullProgressHours) * 100));

                const item = document.createElement("article");
                item.className = "game-item";
                item.style.setProperty("--progress", `${progress}%`);
                item.style.setProperty("--bar-start", game.color[0]);
                item.style.setProperty("--bar-end", game.color[1]);
                item.innerHTML = `
                    <div class="game-cover">
                        <img src="${game.image}" alt="${game.title} 游戏图片" loading="lazy" onerror="this.style.display='none'">
                    </div>
                    <div class="game-info">
                        <div class="game-upper">
                            <div>
                                <h2>${game.title}</h2>
                                <span class="game-hours">${game.hours.toFixed(1)}h</span>
                                <div class="progress-track">
                                    <div class="progress-fill"></div>
                                </div>
                            </div>

                            <div class="screenshot-gallery">
                                <span class="screenshot-title">游戏截图</span>
                                <div class="screenshot-grid">
                                    ${renderScreenshots(game)}
                                </div>
                            </div>
                        </div>

                        <div class="game-review">
                            <strong>我的评价</strong>
                            <p>${game.review}</p>
                        </div>
                        <span class="rating-pill">${renderStars(game.rating)}</span>
                    </div>
                `;
                gameList.appendChild(item);
            });
        }

        renderGames();

        gameList.addEventListener("click", (event) => {
            const button = event.target.closest(".screenshot-button");
            if (!button) return;
            openLightbox(button.dataset.image, button.dataset.caption);
        });

        lightboxClose.addEventListener("click", closeLightbox);

        imageLightbox.addEventListener("click", (event) => {
            if (event.target === imageLightbox) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeLightbox();
            }
        });
    </script>
